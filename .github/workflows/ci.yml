# Runs the test suites on every push and pull request.
#
# Scope is deliberately the network-free suites only - the ones that need
# no credentials and no services. Two things are therefore NOT run here:
#
#   - tests/test_app_backend.py, which calls the real OpenAI API. It is
#     gated behind conftest.py's `openai_available` fixture, so it would
#     skip on its own, but --ignore keeps that explicit: CI must never be
#     able to spend API credits on a push.
#   - The 23 tests behind the `pg_available` fixture, which need Postgres.
#     They skip cleanly when it is unreachable. Adding a pgvector service
#     container here is the natural next step, not a prerequisite.
#
# Verified locally: with no .env file and no OPENAI_API_KEY in the
# environment - exactly this runner's situation - the backend suite is
# 91 passed, 23 skipped. Every field in app/config.py has a default, and
# validate_for_startup() runs from the FastAPI lifespan handler rather
# than at import, so merely importing the package needs no configuration.
name: CI

# `dev` only, deliberately. `main` is kept frozen as the educational
# record of how the project grew, so it is not a branch that receives
# pushes or needs a passing build - pointing CI at it would only put red
# marks on an archive whose older code predates this workflow anyway.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.13 matches the Dockerfile's python:3.13-slim base, so a green
      # run here says something about the image that actually deploys.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A syntactically present but deliberately unusable key. app/llm.py
      # constructs its six ChatOpenAI clients and OpenAIEmbeddings at
      # MODULE scope, and recent openai SDKs raise "Missing credentials"
      # at construction rather than at first call - so on a clean install
      # `import app` fails outright without some value here, taking the
      # whole run down at collection. (A developer's older, already-built
      # virtualenv does not reproduce this, which is precisely why it
      # went unnoticed until a clean-room run.)
      #
      # No request reaches OpenAI: the one file that makes real calls is
      # excluded below, and conftest.py treats this exact string as "no
      # key", so the `openai_available` gate still holds if a Postgres
      # service container is added here later.
      - name: Run tests
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pytest tests/ --ignore=tests/test_app_backend.py -q

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json pins and fails if the lockfile is out of step
      # with package.json, so CI cannot silently test a different
      # dependency tree than the one committed.
      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # package.json's "test" is `vitest run` - single-shot, not watch
      # mode, which would hang a runner forever.
      - name: Run tests
        run: npm test
        working-directory: frontend
