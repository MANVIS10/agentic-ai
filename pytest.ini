[pytest]
asyncio_mode = auto
# app.db's connection pool (and its AsyncPostgresSaver checkpointer) is a
# lazily-created module-level singleton, exactly matching production: a
# real server process opens it once and reuses it for the process's whole
# lifetime, on the ONE event loop that process runs. pytest-asyncio's
# default is a fresh event loop per async test function, which would leave
# the pool's internal asyncio locks/tasks bound to a DIFFERENT (closed)
# loop than the one a later test runs on - not a slow-down, an outright
# deadlock (a loop-bound asyncio.Lock created under a dead loop never wakes
# a waiter on a new one). A single session-scoped loop for the whole test
# run matches the pool's own lifetime assumption.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
